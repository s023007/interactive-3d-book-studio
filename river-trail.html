<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#152b24">
<link rel="stylesheet" href="./river-trail.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js"}}</script>
<title>أثر عند النهر | ورّاق</title>
</head>
<body>
<main class="game">
  <div id="world" class="world" aria-label="عالم الغابة والنهر">
    <canvas id="landscape" aria-hidden="true"></canvas>
    <div id="targets" class="targets"></div>
    <div id="flash" aria-hidden="true"></div>
  </div>
  <header class="top">
    <a class="home" href="./adventure.html"><span>✦</span> ورّاق</a>
    <div class="top-actions">
      <button id="sound" type="button" aria-pressed="false" disabled>صوت البيئة</button>
      <button id="journal" type="button">دفتر الرحلة</button>
    </div>
  </header>
  <section class="mission" aria-labelledby="title">
    <p class="region">وادي السَّمُر · الصف الخامس</p>
    <h1 id="title">أثر عند النهر</h1>
    <ol class="steps" aria-label="مراحل الرحلة">
      <li aria-current="step">اتبع الأثر</li><li>أصلح الجسر</li><li>التقط الصورة</li>
    </ol>
    <p id="objective" role="status">جارٍ تجهيز الوادي…</p>
    <div id="bridge-math" class="bridge-math" hidden>
      <div id="slots" class="slots" role="img" aria-label="أربع خانات مركبة من أصل ثمان"></div>
      <div class="equation" dir="ltr"><span class="fraction"><b>٤</b><span>٨</span></span><span>+</span><span class="fraction"><b id="addition">؟</b><span>٨</span></span><span id="comparison">←</span><span class="fraction"><b>٦</b><span>٨</span></span></div>
    </div>
  </section>
  <section class="controls" aria-label="عناصر التحكم">
    <div class="steering" aria-label="اتجاه المشي" dir="ltr">
      <button type="button" data-dir="up" aria-label="إلى الأمام">↑</button>
      <button type="button" data-dir="left" aria-label="إلى اليسار">←</button>
      <button type="button" data-dir="down" aria-label="إلى الخلف">↓</button>
      <button type="button" data-dir="right" aria-label="إلى اليمين">→</button>
    </div>
    <div class="play-actions">
      <button id="hint" type="button" disabled>تلميح</button>
      <button id="action" type="button" disabled>تابع الأثر</button>
    </div>
  </section>
  <p id="help" class="help">المس أرض المسار للمشي، أو استخدم الأسهم. مفتاح المسافة للتفاعل.</p>
  <dialog id="log" aria-labelledby="log-title">
    <div class="dialog-header"><h2 id="log-title">دفتر الرحلة</h2><button id="close-log" type="button" aria-label="إغلاق الدفتر">×</button></div>
    <figure id="photo" hidden><img id="photo-image" alt="لقطة من الوادي تظهر الحيوان في السهل"><figcaption>صورة من رحلتك في الوادي</figcaption></figure>
    <p id="log-text">تظهر صورة الحيوان بعد عبور النهر.</p>
    <button id="restart" type="button">ابدأ الرحلة من جديد</button>
  </dialog>
  <noscript><p class="help">يتطلب هذا المستوى تفعيل JavaScript.</p></noscript>
</main>
<script type="module" src="./river-trail.js"></script>
</body>
</html>
